<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Reel Deal Fishing Game</title>
    <!-- Use Inter font and internal CSS -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        
        /* --- GLOBAL STYLES --- */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b1121; /* Deep blue background */
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1rem;
            margin: 0;
        }

        /* --- MAIN CONTAINER / CARD --- */
        .main-card {
            width: 100%;
            max-width: 48rem; /* max-w-4xl */
            padding: 1.5rem; /* p-6 */
            background-color: #1f2937; /* bg-gray-800 */
            border-radius: 1rem; /* rounded-2xl */
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); /* shadow-2xl */
        }
        
        .main-title {
            font-size: 2.25rem; /* text-4xl */
            font-weight: 800; /* font-extrabold */
            text-align: center;
            margin-bottom: 1.5rem; /* mb-6 */
            color: #fcd34d; /* text-yellow-300 */
        }

        /* --- LAYOUT AND PANELS --- */
        .game-container {
            display: flex;
            flex-direction: column;
            gap: 1.5rem; /* gap-6 */
        }

        .fishing-area {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1rem; /* p-4 */
            background-color: #374151; /* bg-gray-700 */
            border-radius: 0.75rem; /* rounded-xl */
            box-shadow: inset 0 2px 4px 0 rgba(0, 0, 0, 0.06); /* shadow-inner */
        }

        .inventory-panel {
            width: 100%;
            padding: 1rem; /* p-4 */
            background-color: #374151; /* bg-gray-700 */
            border-radius: 0.75rem; /* rounded-xl */
            box-shadow: inset 0 2px 4px 0 rgba(0, 0, 0, 0.06); /* shadow-inner */
        }

        .inventory-panel h2 {
            font-size: 1.5rem; /* text-2xl */
            font-weight: 700; /* font-bold */
            margin-bottom: 1rem; /* mb-4 */
            border-bottom: 1px solid #4b5563; /* border-b border-gray-600 */
            padding-bottom: 0.5rem; /* pb-2 */
            color: #facc15; /* text-yellow-400 */
        }

        .inventory-list {
            list-style: none;
            padding: 0;
            margin: 0;
            line-height: 1.5;
            color: #d1d5db; /* text-gray-300 */
        }
        
        .inventory-list li {
            padding: 0.25rem 0; /* p-1 */
            border-bottom: 1px solid #4b5563; /* border-b border-gray-600 */
            font-weight: 600; /* font-semibold */
        }
        
        .inventory-list .placeholder {
            color: #6b7280; /* text-gray-500 */
            font-style: italic;
        }


        /* Desktop Layout (md:flex-row) */
        @media (min-width: 768px) {
            .game-container {
                flex-direction: row;
            }
            .inventory-panel {
                width: 33.3333%; /* md:w-1/3 */
            }
        }

        /* --- STATUS PANEL --- */
        .status-panel {
            width: 100%;
            margin-bottom: 1rem; /* mb-4 */
            padding: 0.75rem; /* p-3 */
            background-color: #111827; /* bg-gray-900 */
            border-radius: 0.5rem; /* rounded-lg */
            display: flex;
            justify-content: space-around;
            font-size: 0.875rem; /* text-sm */
            font-family: monospace; /* font-mono */
        }

        /* --- ACTION BUTTON --- */
        .action-button {
            background-color: #4f46e5; /* bg-indigo-600 */
            padding: 0.75rem 2rem; /* px-8 py-3 */
            color: white;
            font-weight: 700; /* font-bold */
            border-radius: 0.75rem; /* rounded-xl */
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); /* shadow-lg */
            margin-top: 1.5rem; /* mt-6 */
            transition: background-color 0.2s, transform 0.2s, opacity 0.2s;
            border: none;
            cursor: pointer;
        }

        .action-button:hover {
            background-color: #4338ca; /* hover:bg-indigo-700 */
            transform: scale(1.05); /* hover:scale-105 */
        }

        .action-button:active {
            transform: scale(0.95); /* active:scale-95 */
        }

        .action-button:disabled {
            opacity: 0.5; /* disabled:opacity-50 */
            cursor: not-allowed;
        }

        /* --- MINIGAME BAR --- */
        .minigame-area {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            position: relative;
        }
        
        .hidden {
            display: none;
        }

        .game-bar-container {
            height: 400px;
            width: 2.5rem; /* w-10 */
            background-color: #1e3a8a; /* bg-blue-900 */
            border: 4px solid #3b82f6; /* border-4 border-blue-500 */
            border-radius: 9999px; /* rounded-full */
            overflow: hidden;
            position: relative;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05); /* shadow-lg */
        }

        .catch-progress-fill {
            position: absolute;
            bottom: 0;
            width: 100%;
            background-color: rgba(96, 165, 250, 0.5); /* bg-blue-400/50 */
            transition: height 0.1s linear;
        }

        .player-bar {
            position: absolute;
            width: 100%;
            background-color: #10b981; /* bg-green-500 */
            border-radius: 0.5rem; /* rounded-lg */
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); /* shadow-xl */
            height: 60px; /* PLAYER_BAR_HEIGHT constant */
        }

        .fish-target {
            position: absolute;
            width: 100%;
            background-color: #ef4444; /* bg-red-500 */
            border-radius: 9999px; /* rounded-full */
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); /* shadow-lg */
            height: 20px; /* FISH_TARGET_HEIGHT constant */
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Utility Text Colors */
        .text-blue-400 { color: #60a5fa; }
        .text-red-400 { color: #f87171; }
        .text-gray-400 { color: #9ca3af; }
        .text-sm { font-size: 0.875rem; }
        .mt-2 { margin-top: 0.5rem; }
    </style>
</head>
<body>

    <div class="main-card">
        <h1 class="main-title">The Reel Deal: Fishing</h1>

        <!-- Main Game Container -->
        <div id="game-container" class="game-container">

            <!-- Fishing Area & Minigame -->
            <div id="fishing-area-container" class="fishing-area">
                <p id="message" class="text-xl font-bold mb-4 h-6">Ready to cast!</p>

                <!-- Status Panel -->
                <div id="status-panel" class="status-panel">
                    <span id="catch-progress-display" class="text-blue-400">Catch Progress: 0%</span>
                    <span id="fish-difficulty-display" class="text-red-400">Difficulty: -</span>
                </div>

                <!-- Fishing Bar Minigame -->
                <div id="minigame-area" class="minigame-area hidden">
                    <!-- Main Outer Bar (Water Column) -->
                    <div class="game-bar-container">
                        <!-- Catch Progress Overlay (Water Fill) -->
                        <div id="catch-progress-fill" class="catch-progress-fill" style="height: 0%"></div>
                        <!-- Player Bar (Green) -->
                        <div id="player-bar" class="player-bar" style="bottom: 0px;"></div>
                        <!-- Fish Target (Red) -->
                        <div id="fish-target" class="fish-target" style="bottom: 0px;">
                             <!-- Fish Icon (Emoji fallback) -->
                            <span class="text-2xl" role="img" aria-label="Fish">🎣</span>
                        </div>
                    </div>
                </div>

                <!-- Action Button (Removed inline onclick) -->
                <button id="action-button" class="action-button">
                    Cast Line
                </button>
                <p id="instruction-text" class="text-sm text-gray-400 mt-2 hidden">Click or press Spacebar to reel!</p>

            </div>

            <!-- Inventory Panel -->
            <div class="inventory-panel">
                <h2>Catch Log</h2>
                <ul id="inventory-list" class="inventory-list">
                    <li class="placeholder">No catches yet.</li>
                </ul>
            </div>
        </div>
    </div>

    <script>
        // --- GAME CONSTANTS ---
        const GAME_HEIGHT = 400; // Pixels of the minigame container height
        const PLAYER_BAR_HEIGHT = 60; 
        const FISH_TARGET_HEIGHT = 20; 
        const CLICK_VELOCITY = 12; 
        const GRAVITY = -0.4; 
        const GAME_SPEED = 1000 / 60; 

        // --- DOM ELEMENTS ---
        const fishingAreaContainer = document.getElementById('fishing-area-container'); 
        const gameArea = document.getElementById('minigame-area');
        const actionButton = document.getElementById('action-button');
        const messageDisplay = document.getElementById('message');
        const playerBar = document.getElementById('player-bar');
        const fishTarget = document.getElementById('fish-target');
        const catchProgressFill = document.getElementById('catch-progress-fill');
        const inventoryList = document.getElementById('inventory-list');
        const instructionText = document.getElementById('instruction-text');
        const catchProgressDisplay = document.getElementById('catch-progress-display');
        const fishDifficultyDisplay = document.getElementById('fish-difficulty-display');

        // Utility classes for catch log colors (used in JS)
        const FISH_COLOR_CLASSES = {
            'text-green-300': 'color: #90ee90;', 
            'text-blue-300': 'color: #60a5fa;',   
            'text-yellow-300': 'color: #fcd34d;', 
            'text-orange-400': 'color: #fb923c;', 
            'text-purple-400': 'color: #a78bfa;'  
        };


        // --- GAME STATE ---
        let gameState = {
            isFishing: false,
            animationFrameId: null,
            
            // Player Bar State (Y is bottom position in pixels)
            playerY: 0,
            playerVel: 0,

            // Fish Target State
            fishY: 0,
            fishSpeed: 0,
            fishMaxSpeed: 0,
            
            // Minigame State
            catchProgress: 0, // 0 to 100
            currentFish: null,
        };

        // --- FISH DATA (Name, MinSpeed, MaxSpeed, Difficulty, MinLength) ---
        const FISH_TYPES = [
            { name: "Small Fry", minSpeed: 1, maxSpeed: 2, difficulty: 1, minLength: 10, color: 'text-green-300' },
            { name: "Sardine", minSpeed: 2, maxSpeed: 3.5, difficulty: 2, minLength: 15, color: 'text-blue-300' },
            { name: "Trout", minSpeed: 3, maxSpeed: 5, difficulty: 3, minLength: 20, color: 'text-yellow-300' },
            { name: "Bass", minSpeed: 4, maxSpeed: 6.5, difficulty: 4, minLength: 30, color: 'text-orange-400' },
            { name: "Legendary Carp", minSpeed: 5, maxSpeed: 8, difficulty: 5, minLength: 50, color: 'text-purple-400' }
        ];

        // --- UTILITY FUNCTIONS ---

        /** Generates a random integer between min (inclusive) and max (inclusive) */
        function getRandomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        /** Chooses a fish based on a weighted random difficulty */
        function chooseFish() {
            const difficultyWeight = [5, 4, 3, 2, 1]; 
            let totalWeight = difficultyWeight.reduce((a, b) => a + b, 0);
            let randomNum = getRandomInt(1, totalWeight);

            let cumulativeWeight = 0;
            for (let i = 0; i < FISH_TYPES.length; i++) {
                cumulativeWeight += difficultyWeight[i];
                if (randomNum <= cumulativeWeight) {
                    return FISH_TYPES[i];
                }
            }
            return FISH_TYPES[0]; // Fallback
        }

        /** Cleans up and displays the result of the minigame. */
        function endGame(success) {
            cancelAnimationFrame(gameState.animationFrameId);
            gameState.isFishing = false;
            gameArea.classList.add('hidden');
            actionButton.disabled = false;
            actionButton.textContent = 'Cast Line';
            instructionText.classList.add('hidden');

            if (success) {
                const fish = gameState.currentFish;
                const length = (Math.random() * (fish.minLength + 20 - fish.minLength) + fish.minLength).toFixed(1);
                const catchName = `${fish.name} (${length} cm)`;
                messageDisplay.textContent = `Caught a ${catchName}!`;
                
                // Add to inventory
                const listItem = document.createElement('li');
                const colorStyle = FISH_COLOR_CLASSES[fish.color] || '';
                listItem.style.cssText = `font-weight: 600; padding: 0.25rem 0; border-bottom: 1px solid #4b5563; ${colorStyle}`;
                listItem.textContent = catchName;

                if (inventoryList.querySelector('li.placeholder')) {
                    inventoryList.innerHTML = ''; // Clear initial message
                }
                inventoryList.prepend(listItem);
                
            } else {
                messageDisplay.textContent = `The ${gameState.currentFish.name} got away!`;
            }
            
            // Reset status panel
            catchProgressDisplay.textContent = `Catch Progress: 0%`;
            fishDifficultyDisplay.textContent = `Difficulty: -`;

            // Reset state
            gameState.catchProgress = 0;
            gameState.currentFish = null;
        }

        // --- GAME LOGIC ---

        /** Initializes and starts the fishing minigame. */
        function startGame() {
            // 1. Setup Initial State
            const fish = chooseFish();
            gameState.currentFish = fish;
            gameState.isFishing = true;
            gameState.catchProgress = 50; 
            gameState.playerY = GAME_HEIGHT / 2; 
            gameState.playerVel = 0;
            gameState.fishY = getRandomInt(0, GAME_HEIGHT - FISH_TARGET_HEIGHT);
            gameState.fishSpeed = 0;
            gameState.fishMaxSpeed = fish.maxSpeed; 

            // 2. Setup UI
            messageDisplay.textContent = `Fighting a ${fish.name}...`;
            actionButton.disabled = true;
            actionButton.textContent = 'REELING...';
            gameArea.classList.remove('hidden');
            instructionText.classList.remove('hidden');
            fishDifficultyDisplay.textContent = `Difficulty: ${fish.difficulty}`;

            // 3. Start Loop
            gameState.animationFrameId = requestAnimationFrame(gameLoop);
        }

        /** The main game loop, called repeatedly via requestAnimationFrame. */
        function gameLoop() {
            const dt = GAME_SPEED / (1000 / 60); // Delta time factor

            // 1. --- Player Bar Physics ---
            gameState.playerVel += GRAVITY * dt;
            gameState.playerY += gameState.playerVel * dt;

            // Clamping the player bar to the boundaries
            const maxPlayerY = GAME_HEIGHT - PLAYER_BAR_HEIGHT;
            if (gameState.playerY < 0) {
                gameState.playerY = 0;
                gameState.playerVel = 0;
            } else if (gameState.playerY > maxPlayerY) {
                gameState.playerY = maxPlayerY;
                gameState.playerVel = 0;
            }

            // 2. --- Fish Target Movement (Random Walk) ---
            gameState.fishSpeed += (Math.random() - 0.5) * gameState.fishMaxSpeed * 0.4 * dt;
            
            // Clamp fish speed
            const maxSpeed = gameState.fishMaxSpeed; 
            gameState.fishSpeed = Math.min(Math.max(gameState.fishSpeed, -maxSpeed), maxSpeed);

            // Apply speed to position
            gameState.fishY += gameState.fishSpeed * dt;

            // Clamp fish position and reverse speed if hitting boundaries
            const maxFishY = GAME_HEIGHT - FISH_TARGET_HEIGHT;
            if (gameState.fishY < 0) {
                gameState.fishY = 0;
                gameState.fishSpeed *= -0.8; // Dampen bounce
            } else if (gameState.fishY > maxFishY) {
                gameState.fishY = maxFishY;
                gameState.fishSpeed *= -0.8; // Dampen bounce
            }

            // 3. --- Catch Progress Calculation ---
            const playerTop = gameState.playerY + PLAYER_BAR_HEIGHT;
            const fishTop = gameState.fishY + FISH_TARGET_HEIGHT;
            const isOverlapping = (playerTop > gameState.fishY) && (gameState.playerY < fishTop);

            if (isOverlapping) {
                // Calculate alignment factor for better control feedback
                const playerCenter = gameState.playerY + PLAYER_BAR_HEIGHT / 2;
                const fishCenter = gameState.fishY + FISH_TARGET_HEIGHT / 2;
                const tolerance = (PLAYER_BAR_HEIGHT + FISH_TARGET_HEIGHT) / 2;
                const alignmentFactor = 1 - (Math.abs(playerCenter - fishCenter) / tolerance); 
                
                gameState.catchProgress += (0.3 + alignmentFactor * 0.6) * dt; 
            } else {
                gameState.catchProgress -= 0.25 * dt; 
            }

            // Clamp progress
            gameState.catchProgress = Math.min(Math.max(gameState.catchProgress, 0), 100);

            // 4. --- Check for Win/Loss Condition ---
            if (gameState.catchProgress >= 100) {
                endGame(true);
                return;
            } else if (gameState.catchProgress <= 0) {
                endGame(false);
                return;
            }

            // 5. --- Render Updates ---
            playerBar.style.bottom = `${gameState.playerY}px`;
            fishTarget.style.bottom = `${gameState.fishY}px`;
            catchProgressFill.style.height = `${gameState.catchProgress}%`;
            catchProgressDisplay.textContent = `Catch Progress: ${gameState.catchProgress.toFixed(0)}%`;

            // 6. --- Loop Continuation ---
            gameState.animationFrameId = requestAnimationFrame(gameLoop);
        }

        /** Applies upward force to the player bar. */
        function applyImpulse() {
            if (gameState.isFishing) {
                gameState.playerVel += CLICK_VELOCITY;
                gameState.playerVel = Math.min(gameState.playerVel, 14);
            }
        }
        
        // --- EVENT HANDLERS ---

        /** Handles the main action button click. */
        function handleAction() {
            if (!gameState.isFishing) {
                startGame();
            }
        }

        /** Handles mouse clicks and touch events for the minigame. */
        function handleInteraction(event) {
            if (gameState.isFishing) {
                event.preventDefault(); 
                applyImpulse();
            }
        }

        /** Handles keyboard events (Spacebar). */
        function handleKey(event) {
            if (event.code === 'Space' && gameState.isFishing) {
                event.preventDefault(); // Prevents page scrolling
                applyImpulse();
            }
        }

        // --- INITIALIZATION ---
        
        // Use programmatic event listeners for reliability
        if (fishingAreaContainer) {
            fishingAreaContainer.addEventListener('click', handleInteraction);
            fishingAreaContainer.addEventListener('touchstart', handleInteraction, { passive: false });
        }
        
        // IMPORTANT: Attach click listener to the action button
        if (actionButton) {
            actionButton.addEventListener('click', handleAction);
        }
        
        // Attach keydown listener to the document for maximum reliability
        document.addEventListener('keydown', handleKey);
        
        // Ensure initial UI state is correct
        playerBar.style.height = `${PLAYER_BAR_HEIGHT}px`;
        fishTarget.style.height = `${FISH_TARGET_HEIGHT}px`;

    </script>
</body>
</html>
