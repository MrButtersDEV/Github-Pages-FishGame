<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Reel Deal Fishing Game</title>
    <!-- Use Inter font and internal CSS -->
    <style>
        /* Universal Box Sizing for layout stability */
        * {
            box-sizing: border-box; 
        }

        @import url('https://fonts.googleapis.com/css2?family=Inter:wght400;700;900&display=swap');
        
        /* --- GLOBAL STYLES --- */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0d1b2a; /* Darker, atmospheric blue */
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            min-height: 100vh; 
            padding: 0;
            margin: 0;
            overflow: hidden;
        }

        /* --- MAIN SCALING CONTAINER / CARD --- */
        .main-card {
            width: 400px; /* Default width (stacked layout) */
            max-width: none; 

            padding: 1.5rem; /* Increased padding */
            background-color: #1a2a40; /* Darker navy base */
            border-radius: 1.5rem; 
            
            /* Aquatic Glow Effect */
            border: 2px solid #3c6e71; 
            box-shadow: 
                0 4px 6px rgba(0, 0, 0, 0.4), 
                0 0 20px rgba(60, 110, 113, 0.5); 
            
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%); 
            transform-origin: center center;
            
            transition: width 0.3s ease; /* Smooth transition for width change */
        }
        
        /* Layout for Active Game: Wider card to accommodate side-by-side view */
        .main-card.active-game {
            width: 650px; 
        }

        .main-title {
            font-size: 2.5rem; /* Slightly larger title */
            font-weight: 900; 
            text-align: center;
            margin-bottom: 1.5rem; 
            color: #ffd700; /* Gold */
            text-shadow: 0 0 8px rgba(255, 215, 0, 0.5); /* Subtle glow on title */
        }

        /* --- LAYOUT AND PANELS --- */
        .game-container {
            display: flex;
            flex-direction: column; /* Default: Stacked vertically */
            gap: 1.25rem; /* Increased gap */
        }
        
        /* Layout for Active Game: Side-by-side view */
        .game-container.active-game-layout {
            flex-direction: row; /* Switch to horizontal layout */
            align-items: stretch; /* Ensure panels fill the full height of the fishing area */
        }
        
        /* In active layout, give the fishing area more space (approx 66%) */
        .game-container.active-game-layout > .fishing-area {
            flex: 2; 
        }
        
        /* In active layout, the inventory panel (Catch Log) takes less space (approx 33%) */
        .game-container.active-game-layout > .inventory-panel {
            flex: 1; 
            display: flex; 
            flex-direction: column; /* Ensure inner content remains stacked */
        }

        .fishing-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1.5rem; 
            background-color: #2c4251; /* Lighter panel background */
            border-radius: 1rem; 
            border: 1px solid #3c6e71; 
            box-shadow: inset 0 3px 6px rgba(0, 0, 0, 0.15); 
        }

        .inventory-panel {
            width: 100%;
            padding: 1.5rem; 
            background-color: #2c4251; 
            border-radius: 1rem; 
            border: 1px solid #3c6e71; 
            box-shadow: inset 0 3px 6px rgba(0, 0, 0, 0.15); 
        }

        .inventory-panel h2 {
            font-size: 1.6rem; 
            font-weight: 700; 
            margin-bottom: 0.75rem; 
            border-bottom: 2px solid #4a6c75; 
            padding-bottom: 0.5rem; 
            color: #7fffd4; /* Aquamarine highlight */
        }

        .inventory-list {
            list-style: none;
            padding: 0;
            margin: 0;
            color: #d1d5db; 
            flex-grow: 1; /* Allow list to take up vertical space when side-by-side */
            
            display: flex;
            flex-direction: column;
            gap: 0.6rem; 
        }
        
        .inventory-list li {
            padding: 0;
            font-weight: 600; 
        }
        
        .inventory-list .placeholder {
            color: #8da4b2; /* Lighter placeholder text */
            font-style: italic;
        }


        /* --- STATUS PANEL --- */
        .status-panel {
            width: 100%;
            margin-bottom: 1rem; 
            padding: 0.8rem; 
            background-color: #1f2a36; 
            border-radius: 0.75rem; 
            display: flex;
            justify-content: space-around;
            font-size: 0.95rem; 
            font-family: monospace; 
            letter-spacing: 0.5px;
            box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.5);
        }

        /* --- ACTION BUTTON --- */
        .action-button {
            /* Vibrant, glowing blue button */
            background: linear-gradient(145deg, #1e90ff, #007acc); 
            padding: 0.8rem 2.5rem; 
            color: white;
            font-weight: 700; 
            border-radius: 0.75rem; 
            box-shadow: 0 0 15px rgba(30, 144, 255, 0.6);
            margin-top: 1.5rem; 
            transition: background-color 0.2s, transform 0.2s, opacity 0.2s, box-shadow 0.2s;
            border: none;
            cursor: pointer;
        }

        .action-button:hover {
            background: linear-gradient(145deg, #007acc, #1e90ff);
            transform: scale(1.05); 
            box-shadow: 0 0 25px rgba(30, 144, 255, 1);
        }

        .action-button:active {
            transform: scale(0.95); 
        }

        .action-button:disabled {
            opacity: 0.5; 
            cursor: not-allowed;
            box-shadow: none;
        }

        /* --- MINIGAME BAR (AQUATIC BAR) --- */
        .minigame-area {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            position: relative;
            flex-grow: 1; 
        }
        
        .hidden {
            display: none;
        }

        .game-bar-container {
            /* Now uses dynamic height to prevent clipping on small screens */
            height: min(40vh, 400px); 
            width: 3rem; /* Slightly wider bar */
            /* Gradient for water depth effect */
            background: linear-gradient(to top, #0077b6, #00b4d8, #90e0ef); 
            border: 4px solid #48cae4; 
            border-radius: 9999px; 
            overflow: hidden;
            position: relative;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.5); /* Inner shadow for depth */
            margin-bottom: 0.5rem; 
        }

        .catch-progress-fill {
            position: absolute;
            bottom: 0;
            width: 100%;
            /* Darker blue to represent progress */
            background-color: rgba(0, 50, 80, 0.8); 
            transition: height 0.1s linear;
        }

        .player-bar {
            position: absolute;
            width: 100%;
            background-color: #7fffd4; /* Aquamarine */
            border-radius: 0.5rem; 
            /* Player bar glow */
            box-shadow: 0 0 10px #7fffd4; 
            height: 60px; 
        }

        .fish-target {
            position: absolute;
            width: 100%;
            background-color: #ff6347; /* Tomato Red */
            border-radius: 9999px; 
            /* Fish glow */
            box-shadow: 0 0 15px #ff6347; 
            height: 20px; 
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Utility Text Colors */
        .text-blue-400 { color: #80c7ff; } /* Lighter blue for stats */
        .text-red-400 { color: #ff8a8a; } /* Lighter red for stats */
        .text-gray-400 { color: #b0c4de; }
        .text-sm { font-size: 0.875rem; }
        .mt-2 { margin-top: 0.5rem; }
        
        /* Added class to keep message display height consistent */
        #message {
            height: 1.5rem; 
            line-height: 1.5rem;
            min-height: 1.5rem;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>

    <!-- This is the element that will be scaled to fit the window -->
    <div id="main-card" class="main-card">
        <h1 class="main-title">The Reel Deal: Fishing</h1>

        <!-- Main Game Container -->
        <div id="game-container" class="game-container">

            <!-- Fishing Area & Minigame (Left/Main Panel in Active Mode) -->
            <div id="fishing-area-container" class="fishing-area">
                <!-- Adjusted margin and height for stable message display -->
                <p id="message" class="text-xl font-bold">Ready to cast!</p> 

                <!-- Status Panel -->
                <div id="status-panel" class="status-panel">
                    <span id="catch-progress-display" class="text-blue-400">Catch Progress: 0%</span>
                    <span id="fish-difficulty-display" class="text-red-400">Difficulty: -</span>
                </div>

                <!-- Fishing Bar Minigame -->
                <div id="minigame-area" class="minigame-area hidden">
                    <!-- Main Outer Bar (Water Column) -->
                    <div id="game-bar-container" class="game-bar-container">
                        <!-- Catch Progress Overlay (Water Fill) -->
                        <div id="catch-progress-fill" class="catch-progress-fill" style="height: 0%"></div>
                        <!-- Player Bar (Green) -->
                        <div id="player-bar" class="player-bar" style="bottom: 0px;"></div>
                        <!-- Fish Target (Red) -->
                        <div id="fish-target" class="fish-target" style="bottom: 0px;">
                             <!-- Fish Icon (Emoji fallback) -->
                            <span class="text-2xl" role="img" aria-label="Fish">🎣</span>
                        </div>
                    </div>
                </div>

                <!-- Action Button (Removed inline onclick) -->
                <button id="action-button" class="action-button">
                    Cast Line
                </button>
                <p id="instruction-text" class="text-sm text-gray-400 mt-2 hidden">Click or press Spacebar to reel!</p>

            </div>

            <!-- Inventory Panel (Right Panel in Active Mode) -->
            <div id="inventory-panel" class="inventory-panel">
                <h2>Catch Log</h2>
                <ul id="inventory-list" class="inventory-list">
                    <li class="placeholder">No catches yet.</li>
                </ul>
            </div>
        </div>
    </div>

    <script>
        // --- GAME CONSTANTS ---
        const PLAYER_BAR_HEIGHT = 60; // Fixed pixel height of player bar
        const FISH_TARGET_HEIGHT = 20; // Fixed pixel height of fish
        const CLICK_VELOCITY = 12; 
        const GRAVITY = -0.4; 
        const GAME_SPEED = 1000 / 60; 
        
        // --- DOM ELEMENTS ---
        const mainCard = document.getElementById('main-card'); // The element that will be scaled
        const gameContainer = document.getElementById('game-container');
        const gameBarContainer = document.getElementById('game-bar-container'); 
        const fishingAreaContainer = document.getElementById('fishing-area-container'); 
        const gameArea = document.getElementById('minigame-area');
        const actionButton = document.getElementById('action-button');
        const messageDisplay = document.getElementById('message');
        const playerBar = document.getElementById('player-bar');
        const fishTarget = document.getElementById('fish-target');
        const catchProgressFill = document.getElementById('catch-progress-fill');
        const inventoryList = document.getElementById('inventory-list');
        const instructionText = document.getElementById('instruction-text');
        const catchProgressDisplay = document.getElementById('catch-progress-display');
        const fishDifficultyDisplay = document.getElementById('fish-difficulty-display');

        // Utility classes for catch log colors (used in JS)
        const FISH_COLOR_CLASSES = {
            'text-green-300': 'color: #90ee90;', 
            'text-blue-300': 'color: #60a5fa;',   
            'text-yellow-300': 'color: #fcd34d;', 
            'text-orange-400': 'color: #fb923c;', 
            'text-purple-400': 'color: #a78bfa;'  
        };


        // --- GAME STATE ---
        let gameState = {
            isFishing: false,
            animationFrameId: null,

            // Player Bar State (Y is bottom position in pixels)
            playerY: 0,
            playerVel: 0,

            // Fish Target State
            fishY: 0,
            fishSpeed: 0,
            fishMaxSpeed: 0,
            
            // Minigame State
            catchProgress: 0, // 0 to 100
            currentFish: null,
        };

        // --- FISH DATA (Name, MinSpeed, MaxSpeed, Difficulty, MinLength) ---
        const FISH_TYPES = [
            { name: "Small Fry", minSpeed: 1, maxSpeed: 2, difficulty: 1, minLength: 10, color: 'text-green-300' },
            { name: "Sardine", minSpeed: 2, maxSpeed: 3.5, difficulty: 2, minLength: 15, color: 'text-blue-300' },
            { name: "Trout", minSpeed: 3, maxSpeed: 5, difficulty: 3, minLength: 20, color: 'text-yellow-300' },
            { name: "Bass", minSpeed: 4, maxSpeed: 6.5, difficulty: 4, minLength: 30, color: 'text-orange-400' },
            { name: "Legendary Carp", minSpeed: 5, maxSpeed: 8, difficulty: 5, minLength: 50, color: 'text-purple-400' }
        ];

        // --- UTILITY FUNCTIONS ---

        /** Calculates and applies the scale factor to the main card to fit the window. */
        function scaleGame() {
            if (!mainCard) return;

            const windowWidth = window.innerWidth;
            const windowHeight = window.innerHeight;
            
            // 1. Calculate idealHeight and idealWidth (unscaled dimensions of the card)
            const originalTransform = mainCard.style.transform;
            // Temporarily reset transform to get true, unscaled dimensions
            mainCard.style.transform = 'translate(-50%, -50%)'; 
            
            const idealHeight = mainCard.offsetHeight;
            const idealWidth = mainCard.offsetWidth; // Dynamically grab the unscaled width
            
            mainCard.style.transform = originalTransform; // Restore original transform

            // 2. Define buffers (space around the card)
            const VERTICAL_BUFFER = 32; 
            const HORIZONTAL_BUFFER = 32;

            // 3. Calculate scale based on the limiting factor (width or height)
            const scaleX = (windowWidth - HORIZONTAL_BUFFER) / idealWidth;
            const scaleY = (windowHeight - VERTICAL_BUFFER) / idealHeight;
            
            // Use the smaller scale factor to ensure everything fits inside the bounds
            const scaleFactor = Math.min(scaleX, scaleY);
            
            // Ensure the scale factor is not negative or zero, and limit max scaling to 1 (don't scale up past ideal size)
            const finalScale = Math.min(1, Math.max(0.1, scaleFactor));

            // Apply the transform to the main card, maintaining the center translation
            mainCard.style.transform = `translate(-50%, -50%) scale(${finalScale})`;
        }

        /** Generates a random integer between min (inclusive) and max (inclusive) */
        function getRandomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        /** Chooses a fish based on a weighted random difficulty */
        function chooseFish() {
            const difficultyWeight = [5, 4, 3, 2, 1]; 
            let totalWeight = difficultyWeight.reduce((a, b) => a + b, 0);
            let randomNum = getRandomInt(1, totalWeight);

            let cumulativeWeight = 0;
            for (let i = 0; i < FISH_TYPES.length; i++) {
                cumulativeWeight += difficultyWeight[i];
                if (randomNum <= cumulativeWeight) {
                    return FISH_TYPES[i];
                }
            }
            return FISH_TYPES[0]; // Fallback
        }

        /** Cleans up and displays the result of the minigame. */
        function endGame(success) {
            cancelAnimationFrame(gameState.animationFrameId);
            gameState.isFishing = false;
            gameArea.classList.add('hidden');
            actionButton.disabled = false;
            actionButton.textContent = 'Cast Line';
            instructionText.classList.add('hidden');
            
            // --- Layout Change: Reset to Stacked (Default 400px width) ---
            mainCard.classList.remove('active-game');
            gameContainer.classList.remove('active-game-layout');
            
            // Re-run scale calculation to fit the smaller (non-minigame) UI
            scaleGame(); 

            if (success) {
                const fish = gameState.currentFish;
                const length = (Math.random() * (fish.minLength + 20 - fish.minLength) + fish.minLength).toFixed(1);
                const catchName = `${fish.name} (${length} cm)`;
                messageDisplay.textContent = `Caught a ${catchName}!`;
                
                // Add to inventory
                const listItem = document.createElement('li');
                const colorStyle = FISH_COLOR_CLASSES[fish.color] || '';
                // Applying color style directly to list item
                listItem.style.cssText = `font-weight: 600; ${colorStyle}`;
                listItem.textContent = catchName;

                if (inventoryList.querySelector('li.placeholder')) {
                    inventoryList.innerHTML = ''; // Clear initial message
                }
                inventoryList.prepend(listItem);
                
            } else {
                messageDisplay.textContent = `The ${gameState.currentFish.name} got away!`;
            }
            
            // Reset status panel
            catchProgressDisplay.textContent = `Catch Progress: 0%`;
            fishDifficultyDisplay.textContent = `Difficulty: -`;

            // Reset state
            gameState.catchProgress = 0;
            gameState.currentFish = null;
        }

        // --- GAME LOGIC ---

        /** Initializes and starts the fishing minigame. */
        function startGame() {
            // --- Layout Change: Switch to Side-by-Side (Active 650px width) ---
            mainCard.classList.add('active-game');
            gameContainer.classList.add('active-game-layout');
            
            // Re-run scale calculation for the wider/taller (minigame) UI
            scaleGame(); 

            // 2. Setup UI (Must make visible FIRST to establish geometry)
            gameArea.classList.remove('hidden'); 
            
            // Get the dynamic height of the game bar container
            const gameHeight = gameBarContainer.clientHeight; 
            
            // 1. Setup Initial State
            const fish = chooseFish();
            gameState.currentFish = fish;
            gameState.isFishing = true;
            gameState.catchProgress = 50; 
            gameState.playerY = gameHeight / 2; // Start player in the middle
            gameState.playerVel = 0;
            
            // Ensure fish Y position respects the new fixed height
            gameState.fishY = getRandomInt(0, gameHeight - FISH_TARGET_HEIGHT);
            gameState.fishSpeed = 0;
            gameState.fishMaxSpeed = fish.maxSpeed; 

            // 2. Setup UI (Rest of UI updates)
            messageDisplay.textContent = `Fighting a ${fish.name}...`;
            actionButton.disabled = true;
            actionButton.textContent = 'REELING...';
            instructionText.classList.remove('hidden');
            fishDifficultyDisplay.textContent = `Difficulty: ${fish.difficulty}`;

            // 3. Start Loop
            gameState.animationFrameId = requestAnimationFrame(gameLoop);
        }

        /** The main game loop, called repeatedly via requestAnimationFrame. */
        function gameLoop() {
            // Use the clientHeight to get the dynamic height from the CSS (min(40vh, 400px))
            const gameHeight = gameBarContainer.clientHeight;
            const dt = GAME_SPEED / (1000 / 60); // Delta time factor

            // 1. --- Player Bar Physics ---
            gameState.playerVel += GRAVITY * dt;
            gameState.playerY += gameState.playerVel * dt;

            // Clamping the player bar to the boundaries (0 to GAME_HEIGHT - PLAYER_BAR_HEIGHT)
            const maxPlayerY = gameHeight - PLAYER_BAR_HEIGHT;
            if (gameState.playerY < 0) {
                gameState.playerY = 0;
                gameState.playerVel = 0;
            } else if (gameState.playerY > maxPlayerY) {
                gameState.playerY = maxPlayerY;
                gameState.playerVel = 0;
            }

            // 2. --- Fish Target Movement (Random Walk) ---
            gameState.fishSpeed += (Math.random() - 0.5) * gameState.fishMaxSpeed * 0.4 * dt;
            
            // Clamp fish speed
            const maxSpeed = gameState.fishMaxSpeed; 
            gameState.fishSpeed = Math.min(Math.max(gameState.fishSpeed, -maxSpeed), maxSpeed);

            // Apply speed to position
            gameState.fishY += gameState.fishSpeed * dt;

            // Clamp fish position and reverse speed if hitting boundaries
            const maxFishY = gameHeight - FISH_TARGET_HEIGHT;
            if (gameState.fishY < 0) {
                gameState.fishY = 0;
                gameState.fishSpeed *= -0.8; // Dampen bounce
            } else if (gameState.fishY > maxFishY) {
                gameState.fishY = maxFishY;
                gameState.fishSpeed *= -0.8; // Dampen bounce
            }

            // 3. --- Catch Progress Calculation ---
            const playerTop = gameState.playerY + PLAYER_BAR_HEIGHT;
            const fishTop = gameState.fishY + FISH_TARGET_HEIGHT;
            const isOverlapping = (playerTop > gameState.fishY) && (gameState.playerY < fishTop);

            if (isOverlapping) {
                // Calculate alignment factor for better control feedback
                const playerCenter = gameState.playerY + PLAYER_BAR_HEIGHT / 2;
                const fishCenter = gameState.fishY + FISH_TARGET_HEIGHT / 2;
                const tolerance = (PLAYER_BAR_HEIGHT + FISH_TARGET_HEIGHT) / 2;
                const alignmentFactor = 1 - (Math.abs(playerCenter - fishCenter) / tolerance); 
                
                gameState.catchProgress += (0.3 + alignmentFactor * 0.6) * dt; 
            } else {
                gameState.catchProgress -= 0.25 * dt; 
            }

            // Clamp progress
            gameState.catchProgress = Math.min(Math.max(gameState.catchProgress, 0), 100);

            // 4. --- Check for Win/Loss Condition ---
            if (gameState.catchProgress >= 100) {
                endGame(true);
                return;
            } else if (gameState.catchProgress <= 0) {
                endGame(false);
                return;
            }

            // 5. --- Render Updates ---
            playerBar.style.bottom = `${gameState.playerY}px`;
            fishTarget.style.bottom = `${gameState.fishY}px`;
            catchProgressFill.style.height = `${gameState.catchProgress}%`;
            catchProgressDisplay.textContent = `Catch Progress: ${gameState.catchProgress.toFixed(0)}%`;

            // 6. --- Loop Continuation ---
            gameState.animationFrameId = requestAnimationFrame(gameLoop);
        }

        /** Applies upward force to the player bar. */
        function applyImpulse() {
            if (gameState.isFishing) {
                gameState.playerVel += CLICK_VELOCITY;
                gameState.playerVel = Math.min(gameState.playerVel, 14);
            }
        }
        
        // --- EVENT HANDLERS ---

        /** Handles the main action button click. */
        function handleAction() {
            if (!gameState.isFishing) {
                startGame();
            }
        }

        /** Handles mouse clicks and touch events for the minigame. */
        function handleInteraction(event) {
            if (gameState.isFishing) {
                event.preventDefault(); 
                applyImpulse();
            }
        }

        /** Handles keyboard events (Spacebar). */
        function handleKey(event) {
            if (event.code === 'Space' && gameState.isFishing) {
                event.preventDefault(); // Prevents page scrolling
                applyImpulse();
            }
        }

        // --- INITIALIZATION ---
        
        function initializeGame() {
            // Attach interaction listeners
            if (fishingAreaContainer) {
                // Ensure touch and click both call interaction
                fishingAreaContainer.addEventListener('click', handleInteraction);
                fishingAreaContainer.addEventListener('touchstart', handleInteraction, { passive: false });
            }
            
            if (actionButton) {
                actionButton.addEventListener('click', handleAction);
            }
            
            document.addEventListener('keydown', handleKey);
            
            // Set initial heights for the moving elements
            playerBar.style.height = `${PLAYER_BAR_HEIGHT}px`;
            fishTarget.style.height = `${FISH_TARGET_HEIGHT}px`;

            // Set the initial scale
            scaleGame();
        }

        // Add a listener for when the window finishes loading to ensure all DOM elements are sized correctly
        window.addEventListener('load', initializeGame);
        
        // Resize handler now recalculates and applies the scaling factor
        window.addEventListener('resize', scaleGame);

        // Fallback for environments where 'load' doesn't fire as expected (like some iframes)
        if (document.readyState === 'complete') {
            initializeGame();
        }

    </script>
</body>
</html>
